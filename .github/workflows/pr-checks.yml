name: Deploy website

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Run lint
        run: pnpm lint

      - name: Run fmt:check
        run: pnpm fmt:check

  build-check:
    name: build-check
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Run build check
        run: pnpm build
        env:
          CLOUDFLARE_ENV: prod

  types:
    name: build-check
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Check types
        run: pnpm generate-types && pnpm typecheck
