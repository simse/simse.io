language: 'typescript'
platform: 'bun'

tasks:
  build:
    command: 'bun --bun run astro build'

  dev:
    command: 'astro dev'
    local: true

  deploy:
    deps:
        - build
    command: 'wrangler deploy'

  deploy-staging:
    local: true
    deps:
        - build
    command: 'wrangler deploy --env staging'
